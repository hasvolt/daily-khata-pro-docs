<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rf-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="rf-fiber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="rf-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="rf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="26" ry="26" fill="url(#rf-bg-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />

  <!-- Fiber Network Ambient Ring -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#60a5fa" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Stylized Geometric "R" Monogram -->
  <!-- Vertical Stem -->
  <rect x="34" y="32" width="12" height="56" rx="6" fill="#ffffff" />

  <!-- Upper Loop -->
  <path d="M 40 32 L 64 32 C 77.25 32 86 40.5 86 51 C 86 61.5 77.25 70 64 70 L 40 70 Z" 
        fill="none" 
        stroke="url(#rf-fiber-grad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Lower Dynamic Kick Leg with Fiber Beam -->
  <path d="M 54 64 L 78 88" 
        stroke="url(#rf-accent-grad)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Glowing Connectivity Node -->
  <circle cx="78" cy="88" r="4" fill="#ffffff" filter="url(#rf-glow)" />
  <circle cx="64" cy="32" r="3" fill="#38bdf8" />
</svg>
